# SPDX-License-Identifier: Apache-2.0
name: Web

on:
  pull_request:
    paths:
      - "web/**"
      - "contracts/api/**"
      - ".github/workflows/web.yml"
  # Runs on main too, so pull requests can restore the pnpm cache.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "contracts/api/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ESLint, vue-tsc, Vitest and builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      # Installs the pnpm version named by packageManager in web/package.json.
      # Before setup-node, which asks pnpm where the store it caches is.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # web/packages/api-client/src/generated is generated, never edited
      # (spec sections 28 and 37). The command empties the directory first,
      # so a committed file the generator does not write shows up as deleted.
      # --intent-to-add makes a file that was generated but never committed
      # show up as a diff; git diff ignores untracked files. The comparison
      # is with HEAD, not the index: git add also records the deletions.
      - name: Typed client is up to date
        run: |
          pnpm generate:api
          git add --intent-to-add packages/api-client/src/generated
          git diff --exit-code HEAD -- packages/api-client/src/generated
      - name: ESLint
        run: pnpm lint
      - name: vue-tsc
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build both apps
        run: pnpm build
