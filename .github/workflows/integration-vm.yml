# SPDX-License-Identifier: Apache-2.0
name: Integration tests on virtual machines

# Decision 0015: two virtual machines every night, on demand, and on a pull
# request that carries the label `vm-tests`. A workflow of its own (decision
# 0017): a run started by a label must not report under the names that
# integration.yml is required by.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "agent/**"
      - "infrastructure/testing/**"
      - "infrastructure/development/compose.yaml"
      - "infrastructure/development/Makefile"
      - "infrastructure/development/.env.example"
      - ".github/workflows/integration-vm.yml"
  schedule:
    # 02:17 UTC, off the hour: scheduled runs queue up at :00.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run started by a label has a group of its own: in the group of the
# pushes, adding another label would cancel a running test and then skip it.
concurrency:
  group: integration-vm-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

env:
  # Must satisfy required-version in agent/pyproject.toml.
  UV_VERSION: "0.12.22"

jobs:
  vms:
    name: Integration tests on virtual machines
    # On a pull request: only with the label `vm-tests`, and when a label is
    # added, only when it is that one.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'vm-tests')
      && (github.event.action != 'labeled' || github.event.label.name == 'vm-tests'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOSTMESH_NODE_TYPE: vm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: agent
          enable-cache: true
          cache-python: true
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # QEMU for x86 only, and of the recommended packages only what a
      # virtual machine needs (issue #171). Each was tried without on the
      # runner: dnsmasq-base for `incus admin init` (decision 0015), ovmf
      # ("QEMU failed to run feature checks"), qemu-utils (qemu-img reads
      # the image), qemu-system-modules-spice (Incus starts QEMU with
      # -spice), and incus-agent (the harness reaches the node through it).
      - name: Install Incus and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            incus incus-agent dnsmasq-base \
            qemu-system-x86 qemu-utils ovmf qemu-system-modules-spice
          sudo incus admin init --minimal
          sudo chmod 666 /var/lib/incus/unix.socket
          incus version
      - name: Let the Incus bridge through Docker's firewall
        run: |
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      - name: Install the agent's dependencies
        run: make -C agent install
      # Budget (decision 0015): ready within 150 seconds, reset within 60.
      # Advisory: an overrun is a warning on the run, not a failure.
      - name: Create two nodes
        run: uv run --locked --directory agent python -m hostmesh_testing up
      - name: Reset them
        run: uv run --locked --directory agent python -m hostmesh_testing up
      - name: Integration tests
        run: make -C agent test-integration
      - name: Show the nodes and the Incus daemon log
        if: failure()
        run: |
          incus list || true
          sudo tail -n 60 /var/log/incus/incusd.log || true
          sudo journalctl -u incus --no-pager -n 40 || true
