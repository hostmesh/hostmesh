# SPDX-License-Identifier: Apache-2.0
name: Hygiene

# No path filter: these jobs are required status checks, and a required
# check that never runs blocks its pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must satisfy required-version in infrastructure/hygiene/pyproject.toml
  UV_VERSION: "0.12.22"

jobs:
  tools:
    name: Hygiene tool checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: infrastructure/hygiene
          enable-cache: true
          cache-python: true
      - name: Ruff, mypy and pytest
        run : |
          make -C infrastructure/hygiene install
          make -C infrastructure/hygiene check
      # The scripts behind the gates of the path-aware workflows (decision 0017).
      - name: Workflow scripts
        run: |
          shellcheck .github/scripts/*.sh
          .github/scripts/test.sh
      # Dependabot updates compose.yaml but not the workflow (issue #181).
      - name: The control plane's service containers match compose.yaml
        run: .github/scripts/service-images.sh .github/workflows/control-plane.yml infrastructure/development/compose.yaml

  spdx:
    name: SPDX identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: infrastructure/hygiene
          enable-cache: true
          cache-python: true
      - name: Install the hygiene tool
        run: make -C infrastructure/hygiene install
      - name: SPDX identifiers on authored source files
        run: make -C infrastructure/hygiene spdx

  licenses:
    name: License scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The listings come from the runner's own Composer and pnpm, not from
      # the development stack's containers. The Makefile reads both names
      # from the environment.
      COMPOSER_COMMAND: composer --working-dir=../../control-plane
      PNPM_COMMAND: pnpm --dir ../../web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, intl, pcntl, fileinfo
          coverage: none
          tools: composer:v2
      # --no-scripts: the scan reads what is installed and runs no application code.
      - name: Install the control plane's dependencies
        working-directory: control-plane
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # Installs the pnpm version named by packageManager in web/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the web workspace's dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: infrastructure/hygiene
          enable-cache: true
          cache-python: true
      - name: Install the three Python projects
        run: |
          make -C agent install
          make -C infrastructure/testing install
          make -C infrastructure/hygiene install

      - name: License scan against the allowlist
        run: make -C infrastructure/hygiene licenses
      - name: THIRD_PARTY_NOTICES is up to date
        run: make -C infrastructure/hygiene notices-check
