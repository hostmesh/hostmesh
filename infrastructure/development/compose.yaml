# Local development stack. See README.md in this directory.

name: hostmesh-development

services:
  postgres:
    image: postgres:18.6-trixie
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the server used during first-time initialisation listens
      # on the Unix socket only, so this cannot report ready too early.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-trixie
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ./php
    # Runs as the host user so files written to the bind mount are not
    # owned by root. The Makefile exports HOST_UID and HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../../control-plane:/var/www/html
      # The generated API contract (contracts/api/openapi.json) lives outside
      # control-plane/. Mounted here so that ../contracts resolves in the
      # container as it does on the host and in CI.
      - ../../contracts:/var/www/contracts
      # The Nginx example carries the Content Security Policy that
      # control-plane/config/hostmesh.php defines; a Pest test compares the
      # two. Mounted read-only so that ../infrastructure/nginx resolves in
      # the container as it does on the host and in CI.
      - ../nginx:/var/www/infrastructure/nginx:ro
      # The end-to-end Caddyfile carries the same policy; the same Pest test
      # compares it.
      - ./Caddyfile.e2e:/var/www/infrastructure/development/Caddyfile.e2e:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs queued jobs (spec section 24: Laravel queues on Redis). queue:listen
  # starts a fresh PHP process for every job, so a code change needs no
  # restart. It allows a job 80 seconds: more than a one-shot job's own
  # timeout (60) and less than the queue's retry_after (90).
  worker:
    build:
      context: ./php
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # A fresh checkout has neither vendor/ nor .env until `make install`.
    command:
      - sh
      - -c
      - >-
        until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 2; done;
        exec php artisan queue:listen redis --sleep=1 --timeout=80
    restart: unless-stopped
    volumes:
      - ../../control-plane:/var/www/html
      - ../../contracts:/var/www/contracts
      - ../nginx:/var/www/infrastructure/nginx:ro
      # The end-to-end Caddyfile carries the same policy; the same Pest test
      # compares it.
      - ./Caddyfile.e2e:/var/www/infrastructure/development/Caddyfile.e2e:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node:
    build:
      context: ./node
    # Runs as the host user, like php, so files written to the bind mount
    # are not owned by root. The Makefile exports HOST_UID and HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # Chromium keeps page memory in /dev/shm. Docker's default of 64 MB makes
    # it crash under load (Playwright's Docker guidance).
    shm_size: 1gb
    # Serves both apps with Vite's dev server, with hot reload: the admin
    # app on 5173 and the portal on 5174, behind Caddy. Before the first
    # `make install` there are no dependencies to run it with, so it waits;
    # `make install` restarts the service. pnpm commands still run with
    # `docker compose exec node`.
    command:
      - sh
      - -c
      - if [ -d node_modules ]; then exec pnpm dev; else echo "No node_modules yet. Run make install."; exec sleep infinity; fi
    volumes:
      - ../../web:/workspace/web
      # The typed client is generated from contracts/api/openapi.json.
      # Mounted so that ../contracts resolves in the container as it does
      # on the host and in CI.
      - ../../contracts:/workspace/contracts:ro
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Healthy once Caddy is running and has issued all four certificates
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:2019/config/ &&
          for name in app admin api agent; do
          test -f "/data/caddy/certificates/local/$$name.hostmesh.test/$$name.hostmesh.test.crt" || exit 1;
          done
      interval: 2s
      timeout: 3s
      retries: 30

  # Test doubles (spec section 37): ACME and DNS tests must never reach a
  # production service. Pebble is Let's Encrypt's ACME test server. It
  # validates challenges by asking challtestsrv, a mock DNS server whose
  # records are set through an HTTP management API. Neither keeps state
  # across a restart, and Pebble makes a new root certificate every time.
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command:
      - -config
      - test/config/pebble-config.json
      - -strict
      - -dnsserver
      - challtestsrv:8053
    environment:
      # Validate at once instead of after a random delay of up to 15 seconds.
      PEBBLE_VA_NOSLEEP: "1"
      # By default Pebble rejects 5% of valid nonces to exercise clients.
      PEBBLE_WFE_NONCEREJECT: "0"
    ports:
      - "127.0.0.1:14000:14000" # ACME directory: https://localhost:14000/dir
      - "127.0.0.1:15000:15000" # Management: https://localhost:15000/roots/0
    depends_on:
      - challtestsrv

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    # No default answers: a name resolves only after a test added it.
    command:
      - -defaultIPv4
      - ""
      - -defaultIPv6
      - ""
    ports:
      - "127.0.0.1:8055:8055" # Management API
      - "127.0.0.1:8053:8053/udp" # DNS
      - "127.0.0.1:8053:8053/tcp"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
