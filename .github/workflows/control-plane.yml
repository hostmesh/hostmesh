# SPDX-License-Identifier: Apache-2.0
name: Control plane

on:
  # No path filter here: the gate at the end must report on every pull
  # request (decision 0017). The `changes` job holds the paths.
  pull_request:
  # Runs on main too, so pull requests can restore the Composer cache.
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - "contracts/api/**"
      # A Pest test keeps the Nginx example in step with the configured CSP.
      - "infrastructure/nginx/**"
      # The same test covers the end-to-end Caddyfile.
      - "infrastructure/development/Caddyfile.e2e"
      # The PostgreSQL and Redis versions of the service containers below.
      - "infrastructure/development/compose.yaml"
      - ".github/workflows/control-plane.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decision 0017: the workflow starts on every pull request, so that its
  # gate (the last job) can be a required status check, and this job decides
  # whether the suite has anything to do. The patterns are what it covers.
  changes:
    name: Changed paths (control plane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # The merge commit of the pull request and its first parent, the base:
      # their difference is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this pull request touch what the suite covers?
        id: detect
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          run=$(.github/scripts/changed.sh \
            "control-plane/**" \
            "contracts/api/**" \
            "infrastructure/nginx/**" \
            "infrastructure/development/Caddyfile.e2e" \
            "infrastructure/development/compose.yaml" \
            ".github/workflows/control-plane.yml" \
            ".github/scripts/**" <<< "$files")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Pint, Larastan and Pest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    services:
      # The images of infrastructure/development/compose.yaml. Dependabot
      # updates that file only; the Hygiene workflow fails until these
      # match (.github/scripts/service-images.sh).
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: hostmesh_test
          POSTGRES_USER: hostmesh
          POSTGRES_PASSWORD: hostmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username hostmesh --dbname hostmesh_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.10.2-trixie
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, intl, pcntl, fileinfo
          coverage: pcov
          tools: composer:v2
      - name: Find the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Pint
        run: composer lint
      - name: Larastan
        run: composer analyse
      # contracts/api/openapi.json is generated, never edited (spec sections
      # 28 and 37). --intent-to-add makes a file that was regenerated but
      # never committed show up as a diff; git diff ignores untracked files.
      # Scramble reads the tables of the models behind the API resources,
      # and generation fails when it cannot (issue #63). .env.example names
      # the development database, which does not exist here; the test
      # database does, so it is migrated first. Pest migrates it afresh.
      - name: OpenAPI spec is up to date
        env:
          DB_DATABASE: hostmesh_test
        run: |
          php artisan migrate --force --no-interaction
          composer openapi
          git add --intent-to-add ../contracts/api/openapi.json
          git diff --exit-code -- ../contracts/api/openapi.json
      - name: Pest, in parallel, with the 95% coverage gate
        run: composer test:coverage

  # The required status check of this workflow (decision 0017). It passes
  # when the suite passed, and when it was skipped because the pull request
  # touches nothing it covers. It fails when the change detection failed:
  # GitHub would count the jobs skipped after that as passing.
  gate:
    name: Control plane
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: The suite passed, or had nothing to do
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/gate.sh
