# Local development stack. See README.md in this directory.

name: hostmesh-development

services:
  postgres:
    image: postgres:18.6-trixie
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the server used during first-time initialisation listens
      # on the Unix socket only, so this cannot report ready too early.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-trixie
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ./php
    # Runs as the host user so files written to the bind mount are not
    # owned by root. The Makefile exports HOST_UID and HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../../control-plane:/var/www/html
      # The generated API contract (contracts/api/openapi.json) lives outside
      # control-plane/. Mounted here so that ../contracts resolves in the
      # container as it does on the host and in CI.
      - ../../contracts:/var/www/contracts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 30

  node:
    build:
      context: ./node
    # Runs as the host user, like php, so files written to the bind mount
    # are not owned by root. The Makefile exports HOST_UID and HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # Chromium keeps page memory in /dev/shm. Docker's default of 64 MB makes
    # it crash under load (Playwright's Docker guidance).
    shm_size: 1gb
    # Serves nothing yet: it exists so that pnpm commands can be run with
    # `docker compose exec node`.
    command: ["sleep", "infinity"]
    volumes:
      - ../../web:/workspace/web
      # The typed client is generated from contracts/api/openapi.json.
      # Mounted so that ../contracts resolves in the container as it does
      # on the host and in CI.
      - ../../contracts:/workspace/contracts:ro
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Healthy once Caddy is running and has issued all four certificates
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:2019/config/ &&
          for name in app admin api agent; do
          test -f "/data/caddy/certificates/local/$$name.hostmesh.test/$$name.hostmesh.test.crt" || exit 1;
          done
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
