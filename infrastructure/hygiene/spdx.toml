# SPDX-License-Identifier: Apache-2.0
#
# Which tracked files must start with an SPDX license identifier (spec
# section 36), and which are exempt. `make -C infrastructure/hygiene spdx`
# and the "SPDX identifiers" job of .github/workflows/hygiene.yml enforce it.

# Source files, by suffix. Formats without comments (JSON) and prose
# (Markdown, text) are not source files in this sense.
extensions = [
    ".php", ".py", ".ts", ".vue", ".js", ".css", ".html",
    ".sh", ".sql", ".yml", ".yaml", ".toml", ".neon", ".example",
]

# Source files without a suffix, by name.
filenames = ["Makefile", "Dockerfile", "Caddyfile"]

# What an authored file may say. "Apache-2.0 AND MIT" is for a file that
# combines Hostmesh's code with MIT code it was derived from; such a file
# names the origin next to the identifier.
identifiers = ["Apache-2.0", "Apache-2.0 AND MIT"]

# Exempt files keep the header they came with. One that says "Apache-2.0"
# fails the check; a pattern that matches no tracked file fails it too.
# Patterns are fnmatch patterns: `*` also matches `/`.

[[exclude]]
pattern = "web/packages/ui/src/components/ui/*"
reason = "written by the shadcn-vue CLI and never reformatted (MIT, see the LICENSE in that directory)"

[[exclude]]
pattern = "web/packages/ui/src/lib/utils.ts"
reason = "from shadcn-vue; carries its MIT header"

[[exclude]]
pattern = "web/packages/ui/src/styles/variants.css"
reason = "from shadcn-vue; carries its MIT header"

[[exclude]]
pattern = "web/packages/api-client/src/generated/*"
reason = "generated by openapi-typescript, never edited"

[[exclude]]
pattern = "web/pnpm-lock.yaml"
reason = "lock file"

[[exclude]]
pattern = "control-plane/artisan"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/public/index.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/tests/TestCase.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/app.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/cache.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/database.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/filesystems.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/logging.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/mail.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/queue.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/config/services.php"
reason = "Laravel application skeleton (MIT)"

[[exclude]]
pattern = "control-plane/database/migrations/0001_01_01_000000_create_jobs_table.php"
reason = "Laravel application skeleton (MIT)"
