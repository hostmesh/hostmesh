# SPDX-License-Identifier: Apache-2.0
name: End-to-end

# The Slice 0 exit test (spec section 33, issue #32): Playwright logs in
# through both built apps against the real control plane, PostgreSQL and
# Redis. No path filter: the job is a required status check, and a required
# check that does not run blocks the pull request for good.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # The name of the required status check in the ruleset of `main`.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infrastructure/development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: make up
      - name: Install the control plane and the web workspace
        run: make install
      # Builds both apps, serves the builds behind Caddy with the production
      # headers, migrates the end-to-end database, and makes Chromium in the
      # node service trust Caddy's local CA. The hostnames resolve inside the
      # Compose network, where the tests run, so the runner needs no hosts
      # entries of its own.
      - name: Switch the stack to end-to-end mode
        run: make e2e-up
      - name: Playwright
        run: make e2e
      - name: Upload the Playwright report and traces
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Show service logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color
