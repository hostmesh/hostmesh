# SPDX-License-Identifier: Apache-2.0
name: Integration tests

# Decision 0015: two system containers on every pull request that touches
# the agent or the harness. The virtual machines run in integration-vm.yml.
on:
  # No path filter here: the gate at the end must report on every pull
  # request (decision 0017). The `changes` job holds the paths.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must satisfy required-version in agent/pyproject.toml.
  UV_VERSION: "0.12.22"

jobs:
  # Decision 0017: the workflow starts on every pull request, so that its
  # gate (the last job) can be a required status check, and this job decides
  # whether the suite has anything to do. The patterns are what it covers.
  changes:
    name: Changed paths (integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # The merge commit of the pull request and its first parent, the base:
      # their difference is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this pull request touch what the suite covers?
        id: detect
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          run=$(.github/scripts/changed.sh \
            "agent/**" \
            "infrastructure/testing/**" \
            "infrastructure/development/compose.yaml" \
            "infrastructure/development/Makefile" \
            "infrastructure/development/.env.example" \
            ".github/workflows/integration.yml" \
            ".github/scripts/**" <<< "$files")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  harness:
    name: Harness checks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: infrastructure/testing
          enable-cache: true
          cache-python: true
      - name: Ruff, mypy and pytest
        run: |
          make -C infrastructure/testing install
          make -C infrastructure/testing check

  containers:
    name: Integration tests on containers
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: agent
          enable-cache: true
          cache-python: true
      # With recommended packages: without them `incus admin init` fails
      # for want of dnsmasq (decision 0015). Containers need no QEMU.
      - name: Install Incus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y incus
          sudo incus admin init --minimal
          sudo chmod 666 /var/lib/incus/unix.socket
          incus version
      # Docker on the runner sets the FORWARD policy to DROP, which cuts
      # the Incus bridge off from the network.
      - name: Let the Incus bridge through Docker's firewall
        run: |
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      - name: Install the agent's dependencies
        run: make -C agent install
      # Budget (decision 0015): ready within 60 seconds, reset within 10.
      # Advisory: the harness prints the times and annotates the run with a
      # warning when one is exceeded. One slow mirror must not fail a pull
      # request.
      - name: Create two nodes
        run: uv run --locked --directory agent python -m hostmesh_testing up
      - name: Reset them
        run: uv run --locked --directory agent python -m hostmesh_testing up
      - name: Integration tests
        run: make -C agent test-integration
      - name: Show the nodes and the Incus daemon log
        if: failure()
        run: |
          incus list || true
          sudo tail -n 60 /var/log/incus/incusd.log || true
          sudo journalctl -u incus --no-pager -n 40 || true

  doubles:
    name: ACME and DNS test doubles
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: agent
          enable-cache: true
          cache-python: true
      - name: Start Pebble and the challenge test server
        run: make -C infrastructure/development doubles
      - name: Install the agent's dependencies
        run: make -C agent install
      - name: Tests against the doubles
        run: make -C agent test-doubles
      - name: Show service logs
        if: failure()
        working-directory: infrastructure/development
        run: docker compose logs --no-color pebble challtestsrv

  # The required status check of this workflow (decision 0017). It passes
  # when the suite passed, and when it was skipped because the pull request
  # touches nothing it covers. It fails when the change detection failed:
  # GitHub would count the jobs skipped after that as passing.
  gate:
    name: Integration tests
    if: always()
    needs: [changes, harness, containers, doubles]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: The suite passed, or had nothing to do
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/gate.sh
