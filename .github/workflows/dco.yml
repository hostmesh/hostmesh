# SPDX-License-Identifier: Apache-2.0
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author=$(git log -1 --format='%an' "$c")
            case "$author" in *"[bot]") continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Missing Signed-off-by: $c $(git log -1 --format=%s "$c")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with: git commit -s --amend (or git rebase --signoff)"
          fi
          exit "$fail"
