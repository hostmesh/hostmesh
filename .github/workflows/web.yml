# SPDX-License-Identifier: Apache-2.0
name: Web

on:
  # No path filter here: the gate at the end must report on every pull
  # request (decision 0017). The `changes` job holds the paths.
  pull_request:
  # Runs on main too, so pull requests can restore the pnpm cache.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "contracts/api/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decision 0017: the workflow starts on every pull request, so that its
  # gate (the last job) can be a required status check, and this job decides
  # whether the suite has anything to do. The patterns are what it covers.
  changes:
    name: Changed paths (web)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # The merge commit of the pull request and its first parent, the base:
      # their difference is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this pull request touch what the suite covers?
        id: detect
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          run=$(.github/scripts/changed.sh \
            "web/**" \
            "contracts/api/**" \
            ".github/workflows/web.yml" \
            ".github/scripts/**" <<< "$files")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: ESLint, vue-tsc, Vitest and builds
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version named by packageManager in web/package.json.
      # Before setup-node, which asks pnpm where the store it caches is.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # web/packages/api-client/src/generated is generated, never edited
      # (spec sections 28 and 37). The command empties the directory first,
      # so a committed file the generator does not write shows up as deleted.
      # --intent-to-add makes a file that was generated but never committed
      # show up as a diff; git diff ignores untracked files. The comparison
      # is with HEAD, not the index: git add also records the deletions.
      - name: Typed client is up to date
        run: |
          pnpm generate:api
          git add --intent-to-add packages/api-client/src/generated
          git diff --exit-code HEAD -- packages/api-client/src/generated
      - name: ESLint
        run: pnpm lint
      - name: vue-tsc
        run: pnpm typecheck
      # The component tests of @hostmesh/ui run in headless Chromium
      # (decision 0009). The version comes from the lockfile.
      - name: Install Chromium for the component tests
        run: pnpm --filter @hostmesh/ui exec playwright install --with-deps --only-shell chromium
      - name: Vitest, with the 95% coverage gate
        run: pnpm test:coverage
      - name: Build both apps
        run: pnpm build

  # The required status check of this workflow (decision 0017). It passes
  # when the suite passed, and when it was skipped because the pull request
  # touches nothing it covers. It fails when the change detection failed:
  # GitHub would count the jobs skipped after that as passing.
  gate:
    name: Web
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: The suite passed, or had nothing to do
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/gate.sh
