# SPDX-License-Identifier: Apache-2.0
#
# Weekly version updates for every manifest in the repository. Minor and
# patch releases arrive as one pull request per ecosystem; a major release
# gets its own. Titles start with "chore", so squash merges keep to
# Conventional Commits.
#
# A pull request that changes a production dependency may fail the
# "License scan" job on THIRD_PARTY_NOTICES: see
# infrastructure/hygiene/README.md.
version: 2

updates:
  - package-ecosystem: composer
    directory: /control-plane
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  # pnpm workspace: the lockfile and the catalog are at /web.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    # Versions the workspace holds back on purpose. The catalog in
    # web/pnpm-workspace.yaml says why, next to each entry.
    ignore:
      # The major reka-ui depends on, so the bundle holds one copy
      # (decision 0009). Raise it when reka-ui moves.
      - dependency-name: "@vueuse/core"
        update-types:
          - version-update:semver-major
      # The types of the Node major that is pinned (decision 0007).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # 6.0.x only: typescript-eslint accepts <6.1.0 and vue-tsc fails on 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # 3.3.12 and 3.3.13 report "Cannot find name" for the variable of a
      # v-for on an element that also has v-slot. A later release is offered
      # again; add it here if it still fails, and remove the entry when one
      # passes.
      - dependency-name: vue-tsc
        versions:
          - 3.3.12
          - 3.3.13
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        # Its version must equal PLAYWRIGHT_VERSION in the node image
        # (infrastructure/development/node/Dockerfile, decision 0009), so it
        # gets a pull request of its own, to which the image change is added.
        exclude-patterns:
          - playwright
          # Pinned to the same version as playwright (decision 0016).
          - "@playwright/test"
      # One pull request for both, so the two pins move together.
      playwright:
        patterns:
          - playwright
          - "@playwright/test"

  # The Python projects lock with uv (decision 0005), so the ecosystem is
  # uv, not pip: pip does not read uv.lock.
  - package-ecosystem: uv
    directories:
      - /agent
      - /infrastructure/testing
      - /infrastructure/hygiene
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions are pinned by commit SHA with the tag in a comment on the same
  # line; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"
