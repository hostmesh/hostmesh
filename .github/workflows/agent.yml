# SPDX-License-Identifier: Apache-2.0
name: Agent

on:
  # No path filter here: the gate at the end must report on every pull
  # request (decision 0017). The `changes` job holds the paths.
  pull_request:
  # Runs on main too, so pull requests can restore the uv cache.
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "contracts/agent-protocol/**"
      - ".github/workflows/agent.yml"
      - "infrastructure/testing/**"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decision 0017: the workflow starts on every pull request, so that its
  # gate (the last job) can be a required status check, and this job decides
  # whether the suite has anything to do. The patterns are what it covers.
  changes:
    name: Changed paths (agent)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # The merge commit of the pull request and its first parent, the base:
      # their difference is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this pull request touch what the suite covers?
        id: detect
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          run=$(.github/scripts/changed.sh \
            "agent/**" \
            "contracts/agent-protocol/**" \
            ".github/workflows/agent.yml" \
            "infrastructure/testing/**" \
            ".github/scripts/**" <<< "$files")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Ruff, mypy and pytest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Must satisfy required-version in agent/pyproject.toml.
          version: "0.12.22"
          working-directory: agent
          # Keyed on agent/uv.lock. Python 3.13 (agent/.python-version) is cached with it.
          enable-cache: true
          cache-python: true
      - name: Install dependencies
        run: make install
      - name: Ruff
        run: make lint
      - name: mypy
        run: make typecheck
      # Unit and contract tests only. The integration tests run in integration.yml.
      - name: pytest with the 95% coverage gate
        run: make test-coverage

  # Issue #168: the same tests on the python3 that Debian 13 ships (3.13.5),
  # which the nodes run, besides uv's own build of Python 3.13 above.
  debian-python:
    name: pytest on Debian 13's python3
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The current point release of Debian 13, as a node gets it.
    container: debian:13
    defaults:
      run:
        working-directory: agent
    env:
      # Debian's interpreter, and never one uv downloads.
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install Debian's python3
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 ca-certificates make
          python3 --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Must satisfy required-version in agent/pyproject.toml.
          version: "0.12.22"
          working-directory: agent
          # The cache of the job above is uv's Python build's; this job needs none.
          enable-cache: false
      - name: Install dependencies
        run: make install
      - name: The environment runs on Debian's interpreter
        run: uv run --locked python -c 'import sys; assert sys.base_prefix == "/usr", sys.base_prefix; print(sys.version)'
      # Unit and contract tests, without the coverage gate the job above holds.
      - name: pytest
        run: make test

  # The required status check of this workflow (decision 0017). It passes
  # when the suite passed, and when it was skipped because the pull request
  # touches nothing it covers. It fails when the change detection failed:
  # GitHub would count the jobs skipped after that as passing.
  gate:
    name: Agent
    if: always()
    needs: [changes, checks, debian-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: The suite passed, or had nothing to do
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/gate.sh
